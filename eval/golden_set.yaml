- id: followup-alimony
  question: "And what about maintenance during the case?"
  category: followup
  depends_on: hma-divorce-grounds
  expected_acts: ["THE HINDU MARRIAGE ACT 1955"]
  expected_sections: {}
  notes: >
    Must run immediately after hma-divorce-grounds on the same thread. Tests the
    follow-up classifier, which skips retrieval and reuses existing context.

